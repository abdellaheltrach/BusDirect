<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="bg-[#7eb1ff] px-8">
        <div class="max-w-7xl mx-auto flex flex-row justify-between items-center " >
            
            <img src="/logo.png" alt="page logo" class="w-32">
            <button class="cursor-pointer  hover:bg-[#0066FF]">
                <svg class="border-[3px] rounded-[30px] h-[32px] w-[32px]" xmlns="http://www.w3.org/2000/svg" width="32px"   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user preview-icon"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
           </button>     
            </div>
    </header>

    <main class="p-5 ">
        <section class="max-w-7xl mx-auto grid grid-cols-8  gap-2" >
            <div class="bg-[#7eb1ff] p-[14px] border-2 border-[#DCDEE3] rounded-[8px]  col-span-full flex flex-row gap-5"> 
                <svg  xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-pin preview-icon"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
                <p class="font-bold flex flex-row gap-5">Line: Safi <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-move-right preview-icon"><path d="M18 8L22 12L18 16"/><path d="M2 12H22"/></svg> Marrakech</p>
                <span class="text-[#0C1E4A] font-bold border-2 px-[4px] rounded-[20px] bg-[#0066FF]">80dh/place</span>
            
            </div>
            <div class="bg-[#7eb1ff] p-[8px] rounded-[8px] row-span-12 col-span-3"> item 2</div>
            <!-- places -->
            <div class="bg-[#7eb1ff] p-[8px] rounded-[8px] row-span-12 col-span-5 font-bold"> 
                <div class="flex flex-row gap-3">
                <p class="text-[#D1D5DB] flex flex-row gap-2"> <span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-tickets preview-icon"><path d="m3.173 8.18 11-5a2 2 0 0 1 2.647.993L18.56 8"/><path d="M6 10V8"/><path d="M6 14v1"/><path d="M6 19v2"/><rect x="2" y="8" width="20" height="13" rx="2"/></svg></span>20 total places </p>
                <p class="text-[#008000] flex flex-row gap-2"> <span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check preview-icon"><path d="M20 6 9 17l-5-5"/></svg></span>20 disponible places </p>
                <p class="text-[#0C1E4A]  flex flex-row gap-2"> <span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trending-up preview-icon"><path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/></svg></span>Recette: 0 DH  </p>
                </div>
                <div class="grid grid-cols-9 gap-3 p-3">
                    <div class="bg-[#fff] col-span-2">box1</div>
                    <div class="bg-[#fff] col-span-2">box2</div>
                    <div class="bg-[#fff] col-span-1">box4</div>
                    <div class="bg-[#fff] col-span-2">box5</div>
                    <div class="bg-[#fff] col-span-2">box7</div>

                </div>
            </div>

        </section>
    </main>


    





    <footer class="bg-[#3f5362] px-8 ">
        <div class="max-w-7xl mx-auto">
            <img src="/logo.png" alt="page logo" class="w-32">
                <p class="text-sm text-white ">
                Plus qu'un tracet, une experience!
            </p>
        </div>    
    </footer>
    <script src="/script.js" ></script>
</body>
</html>
